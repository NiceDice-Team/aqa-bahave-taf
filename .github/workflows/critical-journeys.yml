name: BDD – Local Critical Journeys

on:
  pull_request:
    branches: [main, master, develop]
  push:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: critical-journeys-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  critical-journeys:
    name: Docker customer journey gate
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout TAF and pinned application submodules
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.NICE_DICE_REPOS_TOKEN || github.token }}
          submodules: recursive
          fetch-depth: 1

      - name: Show pinned application revisions
        run: git submodule status

      - name: Build local stack and run critical journeys
        run: docker compose up --build --abort-on-container-exit --exit-code-from playwright-tests playwright-tests

      - name: Collect service logs
        if: always()
        run: |
          mkdir -p artifacts
          docker compose logs --no-color > artifacts/docker-compose.log 2>&1 || true

      - name: Upload journey evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: critical-journey-evidence-${{ github.run_id }}
          path: |
            reports/
            test-results/
            artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop local services
        if: always()
        run: docker compose down --volumes
