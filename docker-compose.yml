services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: backend_user
      POSTGRES_PASSWORD: backend_pass
      POSTGRES_DB: backend_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backend_user -d backend_db"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - critical-db:/var/lib/postgresql/data

  mailcatcher:
    image: schickling/mailcatcher
    ports:
      - "1080:1080"
      - "1025:1025"

  backend:
    build:
      context: services/backend
      dockerfile: Dockerfiletest
    command: >
      sh -c "python src/manage.py migrate &&
             python src/manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SETTINGS_MODULE: src.settings
      DB_NAME: backend_db
      DB_USER: backend_user
      DB_PASSWORD: backend_pass
      DB_HOST: db
      DB_PORT: 5432
      DB_SSLMODE: disable
      EMAIL_HOST: mailcatcher
      EMAIL_PORT: 1025
      EMAIL_USE_TLS: "false"
      EMAIL_USE_SSL: "false"
      DEFAULT_FROM_EMAIL: Dice & Decks Support <no-reply@localhost>
      REPLY_TO_EMAIL: no-reply@localhost
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mailcatcher:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/api/products/"]
      interval: 3s
      timeout: 5s
      retries: 40

  seed:
    build:
      context: services/backend
      dockerfile: Dockerfiletest
    command: ["python", "src/manage.py", "load_test_data"]
    environment:
      DJANGO_SETTINGS_MODULE: src.settings
      DB_NAME: backend_db
      DB_USER: backend_user
      DB_PASSWORD: backend_pass
      DB_HOST: db
      DB_PORT: 5432
      DB_SSLMODE: disable
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: services/frontend
      dockerfile: Dockerfile.dev
      args:
        NODE_ENV: development
        NEXT_PUBLIC_BACKEND_URL: http://backend:8000/api/
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_BACKEND_URL: http://backend:8000/api/
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/catalog"]
      interval: 3s
      timeout: 5s
      retries: 60

  playwright-tests:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: local
      API_BASE_URL: http://backend:8000
      FRONTEND_BASE_URL: http://frontend:3000
      MAILCATCHER_BASE_URL: http://mailcatcher:1080
      HEADLESS: "true"
      PARALLEL_WORKERS: "1"
      REPORT_DIR: ./reports
    depends_on:
      seed:
        condition: service_completed_successfully
      frontend:
        condition: service_healthy
    volumes:
      - ./reports:/app/reports
      - ./test-results:/app/test-results

volumes:
  critical-db:
